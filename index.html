<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Smash Game</title>
<style>
body { margin:0; overflow:hidden; background:#111; font-family:Arial; }
#ui {
  position:fixed; top:15px; left:15px; z-index:10;
  color:white; background:rgba(0,0,0,.55);
  padding:12px 16px; border-radius:12px; line-height:1.5;
}
</style>
</head>
<body>

<div id="ui">
<b>3D SMASH</b><br>
Click/tap = throw a ball or block<br>
Aim with the camera, then launch projectiles to smash cubes<br>
Drag = rotate camera<br>
Scroll = zoom<br>
R = reset
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

let scene, camera, renderer, controls;
let raycaster = new THREE.Raycaster();
let mouse = new THREE.Vector2();
let blocks = [];
let falling = [];
let projectiles = [];
let pointerStart = null;
let clock = new THREE.Clock();

const floorY = -3;
const gravity = -9.8;

init();
reset();
animate();

function init() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111118);

  camera = new THREE.PerspectiveCamera(65, innerWidth / innerHeight, 0.1, 100);
  camera.position.set(5, 4, 7);

  renderer = new THREE.WebGLRenderer({ antialias:true });
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.target.set(0, 0, 0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.45));

  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(5, 8, 5);
  light.castShadow = true;
  scene.add(light);

  const floor = new THREE.Mesh(
    new THREE.BoxGeometry(20, .3, 20),
    new THREE.MeshStandardMaterial({ color:0x222222 })
  );
  floor.position.y = floorY - .2;
  floor.receiveShadow = true;
  scene.add(floor);

  window.addEventListener("pointerdown", startThrow);
  window.addEventListener("pointerup", releaseThrow);
  window.addEventListener("keydown", e => {
    if (e.key.toLowerCase() === "r") reset();
  });

  window.addEventListener("resize", () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
}

function reset() {
  for (const b of blocks) scene.remove(b.mesh);
  for (const b of falling) scene.remove(b.mesh);
  for (const p of projectiles) scene.remove(p.mesh);

  blocks = [];
  falling = [];
  projectiles = [];

  const size = .28;
  const gap = .004;

  for (let x = -6; x <= 6; x++) {
    for (let y = -6; y <= 8; y++) {
      for (let z = -4; z <= 4; z++) {
        const mesh = new THREE.Mesh(
          new THREE.BoxGeometry(size, size, size),
          new THREE.MeshStandardMaterial({
            color: new THREE.Color().setHSL(0.57 + y * .012, .7, .5),
            roughness: .55
          })
        );

        mesh.position.set(
          x * (size + gap),
          y * (size + gap),
          z * (size + gap)
        );

        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);

        blocks.push({
          mesh,
          health: 1,
          attached: true,
          velocity: new THREE.Vector3(),
          spin: new THREE.Vector3()
        });
      }
    }
  }
}

function startThrow(e) {
  pointerStart = {
    x: e.clientX,
    y: e.clientY,
    time: performance.now()
  };
}

function releaseThrow(e) {
  if (!pointerStart) return;

  const dx = e.clientX - pointerStart.x;
  const dy = e.clientY - pointerStart.y;
  const distance = Math.hypot(dx, dy);
  const duration = performance.now() - pointerStart.time;
  pointerStart = null;

  // Keep OrbitControls feeling natural: a drag rotates the camera, a tap/click throws.
  if (distance > 8 || duration > 500) return;

  throwProjectile(e);
}

function throwProjectile(e) {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);

  const direction = raycaster.ray.direction.clone().normalize();
  const spawnPosition = camera.position.clone().addScaledVector(direction, 1.2);
  const isBall = Math.random() > .35;
  const radius = isBall ? .18 : .22;

  const mesh = new THREE.Mesh(
    isBall
      ? new THREE.SphereGeometry(radius, 20, 20)
      : new THREE.BoxGeometry(radius * 1.8, radius * 1.8, radius * 1.8),
    new THREE.MeshStandardMaterial({
      color: isBall ? 0xffd166 : 0xef476f,
      roughness: .38,
      metalness: .05
    })
  );

  mesh.position.copy(spawnPosition);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);

  projectiles.push({
    mesh,
    radius,
    life: 4,
    velocity: direction.multiplyScalar(15),
    spin: new THREE.Vector3(
      (Math.random() - .5) * 14,
      (Math.random() - .5) * 14,
      (Math.random() - .5) * 14
    )
  });
}

function smashBlocks(hitPoint, impactDir, impactPower) {
  const radius = .78;

  for (const b of blocks) {
    if (!b.attached) continue;

    const d = b.mesh.position.distanceTo(hitPoint);

    if (d < radius) {
      const strength = (1 - d / radius) * impactPower;
      b.health -= strength;

      b.mesh.scale.multiplyScalar(.94);

      if (b.health <= 0) {
        b.attached = false;

        const outward = b.mesh.position.clone().sub(hitPoint).normalize();

        b.velocity.copy(impactDir)
          .multiplyScalar(9 * strength)
          .add(outward.multiplyScalar(5 * strength));

        b.velocity.y += 2.5 * strength;

        b.spin.set(
          (Math.random() - .5) * 10,
          (Math.random() - .5) * 10,
          (Math.random() - .5) * 10
        );

        falling.push(b);
      }
    }
  }
}

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), .033);

  for (const b of falling) {
    b.velocity.y += gravity * dt;
    b.mesh.position.addScaledVector(b.velocity, dt);

    b.mesh.rotation.x += b.spin.x * dt;
    b.mesh.rotation.y += b.spin.y * dt;
    b.mesh.rotation.z += b.spin.z * dt;

    if (b.mesh.position.y < floorY) {
      b.mesh.position.y = floorY;
      b.velocity.y *= -.25;
      b.velocity.x *= .7;
      b.velocity.z *= .7;
      b.spin.multiplyScalar(.7);
    }
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];

    p.life -= dt;
    p.velocity.y += gravity * .12 * dt;
    p.mesh.position.addScaledVector(p.velocity, dt);

    p.mesh.rotation.x += p.spin.x * dt;
    p.mesh.rotation.y += p.spin.y * dt;
    p.mesh.rotation.z += p.spin.z * dt;

    let collided = false;

    for (const b of blocks) {
      if (!b.attached) continue;

      const hitDistance = p.radius + .21;

      if (p.mesh.position.distanceTo(b.mesh.position) < hitDistance) {
        const impactDir = p.velocity.clone().normalize();
        smashBlocks(p.mesh.position.clone(), impactDir, 1.35);
        collided = true;
        break;
      }
    }

    if (p.mesh.position.y < floorY) {
      p.mesh.position.y = floorY;
      p.velocity.y *= -.35;
      p.velocity.x *= .7;
      p.velocity.z *= .7;
      p.spin.multiplyScalar(.7);
    }

    if (collided || p.life <= 0 || p.mesh.position.length() > 35) {
      scene.remove(p.mesh);
      projectiles.splice(i, 1);
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
</script>

</body>
</html>
